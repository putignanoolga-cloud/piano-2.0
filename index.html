<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleea Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body {
  font-family: 'Inter', sans-serif;
  background: #f8f6f3;
  margin: 0;
  padding: 30px;
  color: #2b2b2b;
}

h1 {
  font-weight: 500;
  margin-bottom: 5px;
}

.subtitle {
  opacity: 0.5;
  margin-bottom: 25px;
}

.container {
  max-width: 1100px;
  margin: auto;
  display: flex;
  gap: 30px;
}

.left, .right {
  flex: 1;
}

.card {
  background: #ffffff;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.04);
}

.task {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  transition: all 0.2s ease;
}

.task:hover {
  transform: translateX(3px);
}

.subtask {
  margin-left: 35px;
  font-size: 14px;
  opacity: 0.7;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 10px;
}

input[type="checkbox"] {
  margin-right: 10px;
  transform: scale(1.1);
  cursor: pointer;
}

.task span {
  flex: 1;
}

button {
  border: none;
  background: #f1ece6;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #e7dfd7;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #e5e0da;
  background: #faf9f7;
}

.completed {
  text-decoration: line-through;
  opacity: 0.4;
}

/* CALENDARIO */

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  background: #f4f1ec;
  position: relative;
  font-size: 14px;
  transition: 0.2s;
}

.day:hover {
  background: #ece6de;
}

.day.active {
  background: #e7dfd7;
}

.dot-small {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
}

/* HEADER */

.header {
  max-width: 1100px;
  margin: auto;
  margin-bottom: 20px;
}

</style>
</head>

<body>

<div class="header">
  <h1>Bentornata ✨</h1>
  <div class="subtitle" id="today"></div>
</div>

<div class="container">

  <div class="left">

    <div class="card">
      <h3>Le tue priorità</h3>
      <div id="taskList"></div>

      <input id="taskInput" placeholder="Scrivi una nuova priorità...">
      <input type="date" id="taskDate">
      <button onclick="addTask()">Aggiungi</button>
    </div>

    <div class="card">
      <h3>Archivio</h3>
      <div id="archiveList"></div>
    </div>

  </div>

  <div class="right">

    <div class="card">
      <h3>Calendario</h3>
      <div class="calendar" id="calendar"></div>
    </div>

  </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let selectedDate = null;

const colors = ["#f2c94c","#6fcf97","#eb5757","#bb6bd9","#56ccf2","#f2994a","#2f80ed"];

function todayText() {
  const d = new Date();
  document.getElementById("today").innerText =
    d.toLocaleDateString("it-IT", { weekday: 'long', day: 'numeric', month: 'long' });
}

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
  const text = taskInput.value;
  const date = taskDate.value;
  if (!text || !date) return;

  tasks.push({ text, date, completed:false, subtasks:[] });
  taskInput.value = "";
  save();
  render();
}

function addSubtask(i) {
  const text = prompt("Sotto-priorità:");
  if (!text) return;
  tasks[i].subtasks.push({ text, completed:false });
  save();
  render();
}

function completeTask(i, si=null) {
  if (si===null) tasks[i].completed = true;
  else tasks[i].subtasks[si].completed = true;
  save();
  render();
}

function render() {
  taskList.innerHTML="";
  archiveList.innerHTML="";

  tasks.forEach((t,i)=>{
    if (selectedDate && t.date!==selectedDate) return;

    const color = colors[new Date(t.date).getDay()];

    const el = document.createElement("div");
    el.className="task";

    el.innerHTML=`
      <span class="dot" style="background:${color}"></span>
      <input type="checkbox" ${t.completed?"checked":""} onchange="completeTask(${i})">
      <span>${t.text}</span>
      <button onclick="addSubtask(${i})">+</button>
    `;

    (t.completed?archiveList:taskList).appendChild(el);

    t.subtasks.forEach((s,si)=>{
      const sub=document.createElement("div");
      sub.className="task subtask";

      sub.innerHTML=`
        <input type="checkbox" ${s.completed?"checked":""} onchange="completeTask(${i},${si})">
        <span>${s.text}</span>
      `;

      (s.completed?archiveList:taskList).appendChild(sub);
    });
  });

  renderCalendar();
}

function renderCalendar() {
  calendar.innerHTML="";

  for(let i=1;i<=30;i++){
    const date=`2024-05-${String(i).padStart(2,"0")}`;

    const d=document.createElement("div");
    d.className="day";
    d.innerText=i;

    if(date===selectedDate) d.classList.add("active");

    const task=tasks.find(t=>t.date===date);
    if(task){
      const dot=document.createElement("div");
      dot.className="dot-small";
      dot.style.background=colors[new Date(date).getDay()];
      d.appendChild(dot);
    }

    d.onclick=()=>{
      selectedDate=date;
      render();
    };

    calendar.appendChild(d);
  }
}

todayText();
render();

</script>

</body>
</html>
