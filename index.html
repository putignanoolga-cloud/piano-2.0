<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Finanziario</title>
<meta name="description" content="Il tuo centro di controllo finanziario personale: budget, entrate e spese, obiettivi, fondo emergenza, patrimonio netto e analisi, tutto in un'unica web app.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="mark">🪙</span> Piano Finanziario</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">I tuoi dati restano solo nel tuo browser.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div><h1 id="pageTitle">Home</h1></div>
      </div>
      <div class="topbar-actions">
        <div class="month-control">
          <label for="globalMonth">Mese di riferimento</label>
          <input type="month" id="globalMonth">
        </div>
      </div>
    </header>

    <main class="view" id="viewRoot"></main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/ledgers.js"></script>
<script src="js/views/budget.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/networth.js"></script>
<script src="js/views/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
